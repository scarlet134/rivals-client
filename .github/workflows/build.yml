          # настоящий эквалайзер на плашке плеера
          def mh(s):
              if "CardLevel(" in s:
                  return s
              old = "k = 0.3f + 0.7f * std::fabs(std::sin(t * (5.0f + i * 1.7f) + i * 1.3f));"
              n = s.count(old)
              s = s.replace(old, "k = CRivalsVisualizer::CardLevel(i, 0.3f + 0.7f * std::fabs(std::sin(t * (5.0f + i * 1.7f) + i * 1.3f)));")
              print("card equalizer:", n)
              return '#include "visualizer.h"\n' + s
          patch("src/game/client/components/rivals/music_hud.cpp", mh)
          print("v10 visualizer OK")

          # кастомный килфид
          def info_cpp(s):
              if "ClRivalsKillfeed" in s:
                  return s
              a = ("\tGraphics()->MapScreen(0, 0, Width * 1.5f, Height * 1.5f);\n"
                   "\tGraphics()->SetColor(1.f, 1.f, 1.f, 1.f);\n\n"
                   "\tfloat StartX = Width * 1.5f - 10.0f;\n")
              b = "\t\tif(pInfoMsg->m_Type == EType::TYPE_KILL && g_Config.m_ClShowKillMessages)\n\t\t{\n\t\t\tRenderKillMsg(pInfoMsg, StartX, y);\n"
              if a not in s or b not in s:
                  print("::warning::killfeed: anchor not found, custom killfeed skipped")
                  return s
              s = s.replace(a, (
                  "\tconst bool RivKf = g_Config.m_ClRivalsKillfeed != 0;\n"
                  "\tconst float RivKfScale = RivKf ? clamp(g_Config.m_ClRivalsKillfeedScale, 50, 150) / 100.0f : 1.0f;\n"
                  "\tGraphics()->MapScreen(0, 0, Width * 1.5f / RivKfScale, Height * 1.5f / RivKfScale);\n"
                  "\tGraphics()->SetColor(1.f, 1.f, 1.f, 1.f);\n\n"
                  "\tfloat StartX = Width * 1.5f / RivKfScale - (RivKf ? 30.0f : 10.0f);\n"), 1)
              custom = r'''		// RIVALS: кастомный килфид
          		if(RivKf && ((pInfoMsg->m_Type == EType::TYPE_KILL && g_Config.m_ClShowKillMessages) || (pInfoMsg->m_Type == EType::TYPE_FINISH && g_Config.m_ClShowFinishMessages)))
          		{
          			const bool Kill = pInfoMsg->m_Type == EType::TYPE_KILL;
          			const int Dummy = g_Config.m_ClDummy;
          			const float Age = (Client()->GameTick(Dummy) - pInfoMsg->m_Tick + Client()->IntraGameTick(Dummy)) / (float)Client()->GameTickSpeed();
          			const float Life = (float)clamp(g_Config.m_ClRivalsKillfeedTime, 3, 10);
          			if(Age > Life)
          				continue;
          			CreateNamesIfNotCreated(pInfoMsg);
          			if(!Kill)
          				CreateFinishTextContainersIfNotCreated(pInfoMsg);

          			// ширина содержимого (повторяет раскладку RenderKillMsg/RenderFinishMsg)
          			float W;
          			if(Kill)
          			{
          				int NumVictims = 0;
          				for(int j = 0; j < pInfoMsg->m_TeamSize; j++)
          					if(pInfoMsg->m_aVictimIds[j] >= 0)
          						NumVictims++;
          				W = pInfoMsg->m_VictimTextWidth + 24.0f + 44.0f * maximum(NumVictims, 1) + 84.0f;
          				if(pInfoMsg->m_aVictimIds[0] != pInfoMsg->m_KillerID)
          					W += 56.0f + pInfoMsg->m_KillerTextWidth;
          				else
          					W -= 40.0f;
          			}
          			else
          				W = (pInfoMsg->m_Diff ? pInfoMsg->m_DiffTextWidth : 0.0f) + pInfoMsg->m_TimeTextWidth + 52.0f + pInfoMsg->m_VictimTextWidth + 24.0f + 22.0f;

          			// анимация: выезжает справа, в конце уезжает обратно
          			const bool Anim = g_Config.m_ClRivalsKillfeedAnim != 0;
          			float In = Anim ? clamp(Age / 0.3f, 0.0f, 1.0f) : 1.0f;
          			In = 1.0f - (1.0f - In) * (1.0f - In) * (1.0f - In);
          			float Out = Anim ? clamp((Age - (Life - 0.4f)) / 0.4f, 0.0f, 1.0f) : 0.0f;
          			Out = Out * Out;
          			const float Px = StartX + (1.0f - In + Out) * (W + 80.0f);

          			const int Local = m_pClient->m_Snap.m_LocalClientID;
          			bool Me = false;
          			if(g_Config.m_ClRivalsKillfeedMe && Local >= 0)
          			{
          				Me = pInfoMsg->m_KillerID == Local;
          				for(int j = 0; j < MAX_KILLMSG_TEAM_MEMBERS; j++)
          					Me |= pInfoMsg->m_aVictimIds[j] == Local;
          			}
          			const ColorRGBA Acc = (!Kill && pInfoMsg->m_RecordPersonal) ? ColorRGBA(1.0f, 0.8f, 0.25f, 1.0f) : CRivalsMusicHud::Accent(1.0f);
          			const float PlateX = Px - W - 18.0f, PlateY = y - 3.0f, PlateW = W + 36.0f, PlateH = 52.0f;
          			const int Style = g_Config.m_ClRivalsKillfeedStyle;
          			const float Fresh = maximum(0.0f, 1.0f - Age / 0.7f);

          			Graphics()->TextureClear();
          			if(Style == 0) // неон
          			{
          				if(Me)
          					Graphics()->DrawRect(PlateX - 4.0f, PlateY - 4.0f, PlateW + 8.0f, PlateH + 8.0f, Acc.WithAlpha(0.35f + 0.3f * Fresh), IGraphics::CORNER_ALL, 18.0f);
          				Graphics()->DrawRect(PlateX, PlateY, PlateW, PlateH, ColorRGBA(0.04f, 0.04f, 0.07f, 0.66f), IGraphics::CORNER_ALL, 14.0f);
          				Graphics()->DrawRect4(PlateX, PlateY, PlateW, PlateH, Acc.WithAlpha(0.0f), Acc.WithAlpha(0.24f + 0.2f * Fresh), Acc.WithAlpha(0.0f), Acc.WithAlpha(0.24f + 0.2f * Fresh), IGraphics::CORNER_ALL, 14.0f);
          				Graphics()->DrawRect(PlateX + PlateW - 10.0f, PlateY + 10.0f, 4.0f, PlateH - 20.0f, Acc.WithAlpha(0.95f), IGraphics::CORNER_ALL, 2.0f);
          				if(Fresh > 0.0f)
          					Graphics()->DrawRect(PlateX, PlateY, PlateW, PlateH, ColorRGBA(1.0f, 1.0f, 1.0f, 0.18f * Fresh), IGraphics::CORNER_ALL, 14.0f);
          			}
          			else if(Style == 1) // стекло
          			{
          				Graphics()->DrawRect(PlateX - 1.5f, PlateY - 1.5f, PlateW + 3.0f, PlateH + 3.0f, (Me ? Acc : ColorRGBA(1.0f, 1.0f, 1.0f, 1.0f)).WithAlpha(Me ? 0.7f : 0.18f), IGraphics::CORNER_ALL, 26.0f);
          				Graphics()->DrawRect4(PlateX, PlateY, PlateW, PlateH, ColorRGBA(1.0f, 1.0f, 1.0f, 0.16f), ColorRGBA(1.0f, 1.0f, 1.0f, 0.16f), ColorRGBA(1.0f, 1.0f, 1.0f, 0.05f), ColorRGBA(1.0f, 1.0f, 1.0f, 0.05f), IGraphics::CORNER_ALL, 26.0f);
          				Graphics()->DrawRect(PlateX, PlateY, PlateW, PlateH, ColorRGBA(0.0f, 0.0f, 0.0f, 0.28f), IGraphics::CORNER_ALL, 26.0f);
          			}
          			else // минимал
          			{
          				Graphics()->DrawRect(PlateX + 10.0f, PlateY + PlateH - 3.0f, (PlateW - 20.0f) * In, 3.0f, Acc.WithAlpha(Me ? 1.0f : 0.6f), IGraphics::CORNER_ALL, 1.5f);
          			}
          			Graphics()->SetColor(1.f, 1.f, 1.f, 1.f);
          			if(Kill)
          				RenderKillMsg(pInfoMsg, Px, y);
          			else
          				RenderFinishMsg(pInfoMsg, Px, y);
          			y += 60.0f * (1.0f - Out);
          			continue;
          		}
          '''
              s = s.replace(b, custom + b, 1)
              return "#include <game/client/components/rivals/music_hud.h>\n" + s
          patch("src/game/client/components/infomessages.cpp", info_cpp)
          print("v10 killfeed OK")
      - name: Configure
        run: |
          mkdir ddnet/release
          cd ddnet/release
          cmake -A x64 "-DEXCEPTION_HANDLING=ON" "-DVULKAN=OFF" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=." ..

      - name: Build client
        shell: python
        working-directory: ddnet/release
        run: |
          import subprocess, sys, re
          p = subprocess.run(["cmake", "--build", ".", "--config", "Release", "--target", "game-client", "game-server"],
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          out = p.stdout.decode("utf-8", "replace")
          print(out)
          if p.returncode != 0:
              errs = []
              for line in out.splitlines():
                  if re.search(r"error [A-Z]+\d+|: error|fatal error", line) and line not in errs:
                      errs.append(line.strip())
              print("=" * 30 + " ОШИБКИ " + "=" * 30)
              for e in errs[:40]:
                  e = re.sub(r"^.*?([A-Za-z_]+\.(?:cpp|h)\()", r"\1", e)
                  print(e)
                  print("::error::" + e[:400])
              sys.exit(p.returncode)

      - name: Package
        shell: pwsh
        run: |
          cd ddnet/release
          cmake --build . --config Release --target package_default
          $zip = Get-ChildItem *-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg
          $root = Get-ChildItem pkg -Directory | Select-Object -First 1
          # свои шрифты из rivals/data/fonts кладём в data/fonts клиента
          Copy-Item "$env:RIVALS_DIR/data/fonts/*" "$($root.FullName)/data/fonts/" -Include *.ttf,*.otf -ErrorAction SilentlyContinue
          Rename-Item $root.FullName "RIVALS-Gores-Client"
          New-Item -ItemType Directory -Force ../../out | Out-Null
          Compress-Archive -Path pkg/RIVALS-Gores-Client -DestinationPath ../../out/RIVALS-Gores-Client-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: RIVALS-Gores-Client-win64
          path: out/RIVALS-Gores-Client-win64.zip

      - name: Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/RIVALS-Gores-Client-win64.zip
