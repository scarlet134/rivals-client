                   "\t\t\t\t\tconst float RivW = Line.m_RivWidth, RivH = Line.m_aYOffset[OffsetType], RivR = MessageRounding();\n"
                   "\t\t\t\t\tconst ColorRGBA RivA0 = CRivalsChatFilter::HighlightColor((0.28f + 0.3f * RivFlash) * Blend);\n"
                   "\t\t\t\t\tconst ColorRGBA RivA1 = CRivalsChatFilter::HighlightColor((0.06f + 0.12f * RivFlash) * Blend);\n"
                   "\t\t\t\t\tGraphics()->DrawRect(x, y, RivW, RivH, ColorRGBA(0.0f, 0.0f, 0.0f, 0.22f * Blend), IGraphics::CORNER_ALL, RivR);\n"
                   "\t\t\t\t\tGraphics()->DrawRect4(x, y, RivW, RivH, RivA0, RivA1, RivA0, RivA1, IGraphics::CORNER_ALL, RivR);\n"
                   "\t\t\t\t\tif(RivNeon)\n\t\t\t\t\t{\n"
                   "\t\t\t\t\t\tGraphics()->DrawRect(x - 1.2f, y + 0.3f, 3.4f, RivH - 0.6f, CRivalsChatFilter::HighlightColor((0.22f + 0.3f * RivFlash) * Blend), IGraphics::CORNER_ALL, 1.7f);\n"
                   "\t\t\t\t\t\tGraphics()->DrawRect(x, y + 0.6f, 1.1f, RivH - 1.2f, CRivalsChatFilter::HighlightColor(0.95f * Blend), IGraphics::CORNER_ALL, 0.55f);\n"
