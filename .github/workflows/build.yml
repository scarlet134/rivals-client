          if '"SpectatorCount"' not in ns:
              i = ns.index("Objects = [")
              j = ns.index("\n]", i)
              ns = ns[:j] + '\n\tNetObjectEx("SpectatorCount", "spectator-count@netobj.ddnet.org", [\n\t\tNetIntRange("m_NumSpectators", 0, \'MAX_CLIENTS\', 0),\n\t], validate_size=False),' + ns[j:]
              open("datasrc/network.py", "w", encoding="utf-8", newline="\n").write(ns)
          print("v11 SpectatorCount OK")

          # chat.h: ширина строки для неоновой плашки
