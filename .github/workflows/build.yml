name: Build RIVALS Client

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  # База: DDNetGores/client (Tater-Client), релиз 18.0.2
  # Если сборка сломается после обновления DDNet — поставь тег, например 19.4
  DDNET_REF: "18.0.2"

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout RIVALS
        uses: actions/checkout@v5
        with:
          path: rivals

      - name: Checkout DDNet
        uses: actions/checkout@v5
        with:
          repository: DDNetGores/client
          ref: ${{ env.DDNET_REF }}
          path: ddnet
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find RIVALS files
        shell: pwsh
        run: |
          # ищем apply_rivals.py в любой папке репозитория
          $script = Get-ChildItem -Path rivals -Recurse -Filter apply_rivals.py | Select-Object -First 1
          if (-not $script) {
            # файлы загружены архивом .zip - распаковываем сами
            Get-ChildItem -Path rivals -Recurse -Filter *.zip | ForEach-Object {
              Write-Host "Unzip $($_.FullName)"
              Expand-Archive -Path $_.FullName -DestinationPath "rivals_unzipped/$($_.BaseName)" -Force
            }
            if (Test-Path rivals_unzipped) {
              $script = Get-ChildItem -Path rivals_unzipped -Recurse -Filter apply_rivals.py | Select-Object -First 1
            }
          }
          if (-not $script) {
            Write-Host "NOT FOUND scripts/apply_rivals.py"
            Get-ChildItem -Path rivals -Recurse | Select-Object -ExpandProperty FullName
            exit 1
          }
          $root = $script.Directory.Parent.FullName
          Write-Host "RIVALS: $root"
          "RIVALS_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply RIVALS patches
        run: python "${{ env.RIVALS_DIR }}/scripts/apply_rivals.py" ddnet

      - name: Fix CMake file list
        shell: python
        working-directory: ddnet
        run: |
          import re, subprocess
          subprocess.run(["git", "checkout", "--", "CMakeLists.txt"], check=True)
          p = "CMakeLists.txt"
          s = open(p, encoding="utf-8").read()
          new = ["components/menus_rivals.cpp", "components/rivals/media_session.cpp", "components/rivals/media_session.h", "components/rivals/music_hud.cpp", "components/rivals/music_hud.h"]
          m = re.search(r"set_src\(GAME_CLIENT GLOB_RECURSE src/game/client[ \t]*\n", s)
          end = re.compile(r"^[ \t]*\)", re.M).search(s, m.end())
          lines = [l for l in s[m.end():end.start()].split("\n") if l.strip()]
          indent = re.match(r"[ \t]*", lines[0]).group(0)
          entries = sorted(set([l.strip() for l in lines] + new))
          s = s[:m.end()] + "".join(indent + e + "\n" for e in entries) + s[end.start():]
          s = s.replace("set(PLATFORM_CLIENT_LIBS opengl32 winmm imm32)", "set(PLATFORM_CLIENT_LIBS opengl32 winmm imm32 windowsapp)", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("CMakeLists.txt OK")
          q = "src/game/client/components/menus_settings.cpp"
          t = open(q, encoding="utf-8").read()
          t = re.sub(r",\s*,(\s*\"RIVALS\")", r",\1", t)
          open(q, "w", encoding="utf-8").write(t)
          print("menus_settings.cpp OK")
          q = "src/game/client/components/rivals/media_session.cpp"
          t = open(q, encoding="utf-8").read()
          if "base/detect.h" not in t:
              t = t.replace('#include "media_session.h"', '#include "media_session.h"\n#include <base/detect.h>', 1)
          open(q, "w", encoding="utf-8").write(t)
          print("media_session.cpp OK")
          c = open("CMakeLists.txt", encoding="utf-8").read()
          if "RIVALS_CXX20" not in c:
              c += ("\n# RIVALS_CXX20\nif(MSVC)\n  set_source_files_properties(src/game/client/components/rivals/media_session.cpp "
                    "PROPERTIES COMPILE_OPTIONS \"/std:c++20;/EHsc\" "
                    "COMPILE_DEFINITIONS _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)\nendif()\n")
              open("CMakeLists.txt", "w", encoding="utf-8").write(c)
          print("C++20 for media_session OK")
          import base64
          ms = open("src/game/client/components/menus_settings.cpp", encoding="utf-8", errors="ignore").read()
          RIV = {
              "src/game/client/components/menus_rivals.cpp": "",
              "src/game/client/components/rivals/music_hud.cpp": "",
              "src/game/client/components/rivals/music_hud.h": "",
          }
          for fn, data in RIV.items():
              t = base64.b64decode(data).decode("utf-8")
              if "UI()->DoLabel" in ms and "Ui()->DoLabel" not in ms:
                  t = t.replace("Ui()->", "UI()->")
              if "Client()->ViewFile" not in ms:
                  t = t.replace("Client()->ViewFile(aBuf);", "open_file(aBuf);")
              open(fn, "w", encoding="utf-8", newline="\n").write(t)
          cv = "src/engine/shared/config_variables.h"
          t = open(cv, encoding="utf-8").read()
          add = ""
          if "(ClRivalsPreset," not in t: add += 'MACRO_CONFIG_INT(ClRivalsPreset, cl_rivals_preset, 0, 0, 3, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: optimizer preset")' + "\n"
          if "(ClRivalsHideParticles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHideParticles, cl_rivals_hide_particles, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: hide particles/details")' + "\n"
          if "(ClRivalsHideSkins," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHideSkins, cl_rivals_hide_skins, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: simple skins only")' + "\n"
          if "(ClRivalsHideBubbles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHideBubbles, cl_rivals_hide_bubbles, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: hide emotes/chat bubbles")' + "\n"
          if "(ClRivalsFastInput," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFastInput, cl_rivals_fast_input, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: fast input / low latency")' + "\n"
          if "(ClRivalsPage," not in t: add += 'MACRO_CONFIG_INT(ClRivalsPage, cl_rivals_page, 0, 0, 4, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: settings sub page")' + "\n"
          if "(ClRivalsAccent," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAccent, cl_rivals_accent, 0, 0, 5, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: accent color")' + "\n"
          if "(ClRivalsFps," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFps, cl_rivals_fps, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: FPS counter")' + "\n"
          if "(ClRivalsClock," not in t: add += 'MACRO_CONFIG_INT(ClRivalsClock, cl_rivals_clock, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: clock")' + "\n"
          if "(ClRivalsShowKeys," not in t: add += 'MACRO_CONFIG_INT(ClRivalsShowKeys, cl_rivals_show_keys, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: show key presses")' + "\n"
          if "(ClRivalsHookLines," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHookLines, cl_rivals_hook_lines, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: hook lines of others")' + "\n"
          if "(ClRivalsFilter," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFilter, cl_rivals_filter, 0, 0, 4, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen filter")' + "\n"
          if "(ClRivalsFilterStrength," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFilterStrength, cl_rivals_filter_strength, 15, 0, 60, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen filter strength")' + "\n"
          if "(ClRivalsParticles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticles, cl_rivals_particles, 0, 0, 5, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen particles (0=off, 1=snow, 2=stars, 3=sakura, 4=sparks, 5=bubbles)")' + "\n"
          if "(ClRivalsParticlesAmount," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticlesAmount, cl_rivals_particles_amount, 60, 10, 250, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen particles amount")' + "\n"
          if "(ClRivalsParticlesAccent," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticlesAccent, cl_rivals_particles_accent, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: tint particles with accent color")' + "\n"
          if "(ClRivalsParticlesBlur," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticlesBlur, cl_rivals_particles_blur, 0, 0, 100, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: particles blur")' + "\n"
          if "(ClRivalsChatSmooth," not in t: add += 'MACRO_CONFIG_INT(ClRivalsChatSmooth, cl_rivals_chat_smooth, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: smooth letters in chat input")' + "\n"
          if "(ClRivalsChatSmoothMs," not in t: add += 'MACRO_CONFIG_INT(ClRivalsChatSmoothMs, cl_rivals_chat_smooth_ms, 200, 50, 600, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: chat letter fade-in time (ms)")' + "\n"
          if "(ClRivalsChatRise," not in t: add += 'MACRO_CONFIG_INT(ClRivalsChatRise, cl_rivals_chat_rise, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: chat letters rise from below")' + "\n"
          if "(ClRivalsAutoreply," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAutoreply, cl_rivals_autoreply, 0, 0, 2, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: autoreply (0 off, 1 when minimized, 2 always)")' + "\n"
          if "(ClRivalsAutoreplyMsg," not in t: add += 'MACRO_CONFIG_STR(ClRivalsAutoreplyMsg, cl_rivals_autoreply_msg, 128, "AFK, will reply later", CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: autoreply message")' + "\n"
          if "(ClRivalsAutoreplyCd," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAutoreplyCd, cl_rivals_autoreply_cd, 20, 5, 120, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: autoreply cooldown (seconds)")' + "\n"
          if "(ClRivalsMirror," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMirror, cl_rivals_mirror, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: mirrored GUI")' + "\n"
          if "(ClRivalsMenuTitle," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMenuTitle, cl_rivals_menu_title, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: RIVALS CLIENT title in main menu")' + "\n"
          if "(ClRivalsMotionBlur," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlur, cl_rivals_motion_blur, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur")' + "\n"
          if "(ClRivalsMotionBlurStrength," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlurStrength, cl_rivals_motion_blur_strength, 50, 10, 100, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur strength")' + "\n"
          if "(ClRivalsMotionBlurAll," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlurAll, cl_rivals_motion_blur_all, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur for all players")' + "\n"
          if "(ClRivalsMotionBlurMode," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlurMode, cl_rivals_motion_blur_mode, 1, 0, 2, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur mode 0 tees 1 screen 2 both")' + "\n"
          if "(ClRivalsBadge," not in t: add += 'MACRO_CONFIG_INT(ClRivalsBadge, cl_rivals_badge, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: badge for RIVALS users")' + "\n"
          a = 'offset from top")\n'
          assert a in t, "config anchor"
          t = t.replace(a, a + add, 1)
          open(cv, "w", encoding="utf-8").write(t)
          print("RIVALS v2 (tabs + visuals) OK")
          # --- RIVALS v4: частицы на заднем фоне + плавный чат ---
          import re as _re
          gh = "src/game/client/gameclient.h"
          t = open(gh, encoding="utf-8").read()
          if "m_RivalsBackground" not in t and "CRivalsMusicHud m_RivalsMusicHud;" in t:
              t = t.replace("CRivalsMusicHud m_RivalsMusicHud;", "CRivalsMusicHud m_RivalsMusicHud;\n\tCRivalsBackground m_RivalsBackground;", 1)
              open(gh, "w", encoding="utf-8").write(t)
          gc = "src/game/client/gameclient.cpp"
          t = open(gc, encoding="utf-8").read()
          if "&m_RivalsBackground" not in t:
              t, n = _re.subn(r"(&m_MapLayersBackground,[^\n]*\n)", lambda mm: mm.group(1) + "\t\t&m_RivalsBackground,\n", t, count=1)
              print("background particles:", "OK" if n else "anchor not found")
              open(gc, "w", encoding="utf-8").write(t)
          ch = "src/game/client/components/chat.cpp"
          t = open(ch, encoding="utf-8").read()
          CHAT_OLD = "\t\tconst STextBoundingBox BoundingBox = m_Input.Render(&InputCursorRect, Cursor.m_FontSize, TEXTALIGN_TL, Changed, MessageMaxWidth, 0.0f);\n"
          CHAT_NEW = base64.b64decode("").decode("utf-8")
          if "s_RivPrevChars" not in t:
              if CHAT_OLD in t:
                  t = t.replace(CHAT_OLD, CHAT_NEW, 1)
                  if "#include <vector>" not in t:
                      t = "#include <vector>\n" + t
                  open(ch, "w", encoding="utf-8").write(t)
                  print("smooth chat OK")
              else:
                  print("smooth chat: anchor not found")
          mst = "src/game/client/components/menus_start.cpp"
          t = open(mst, encoding="utf-8").read()
          if "RenderMenuTitle" not in t:
              mm = _re.search(r"Graphics\(\)->TextureSet\(g_pData->m_aImages\[IMAGE_BANNER\]\.m_Id\);.*?Graphics\(\)->QuadsEnd\(\);", t, _re.S)
              if mm:
                  t = t[:mm.start()] + "if(g_Config.m_ClRivalsMenuTitle)\n\t\tGameClient()->m_RivalsMusicHud.RenderMenuTitle(MainView.w / 2.0f, 50.0f, 115.0f);\n\telse\n\t{\n\t" + mm.group(0) + "\n\t}" + t[mm.end():]
                  t = "#include <engine/shared/config.h>\n#include <game/client/gameclient.h>\n#include <game/client/components/rivals/music_hud.h>\n" + t
                  open(mst, "w", encoding="utf-8").write(t)
                  print("menu title OK")
              else:
                  print("menu title: anchor not found")
          sb = "src/game/client/components/scoreboard.cpp"
          t = open(sb, encoding="utf-8").read()
          if "RivNameOffset" not in t:
              a = "TextRender()->SetCursor(&Cursor, NameOffset, y + (LineHeight - FontSize) / 2.f, FontSize, TEXTFLAG_RENDER | TEXTFLAG_ELLIPSIS_AT_END);"
              if a in t:
                  b = ("float RivNameOffset = NameOffset;\n\t\tif(g_Config.m_ClRivalsBadge && CRivalsMusicHud::IsRivalsClient(m_pClient, pInfo->m_ClientID))\n\t\t{\n\t\t\tm_pClient->m_RivalsMusicHud.RenderBadge(NameOffset + FontSize * 0.4f, y + LineHeight / 2.0f, FontSize * 0.4f, 1.0f);\n\t\t\tRivNameOffset += FontSize * 0.95f;\n\t\t}\n\t\t" + a.replace("NameOffset,", "RivNameOffset,"))
                  t = t.replace(a, b)
                  t = "#include <engine/shared/config.h>\n#include <game/client/gameclient.h>\n#include <game/client/components/rivals/music_hud.h>\n" + t
                  open(sb, "w", encoding="utf-8").write(t)
                  print("badge scoreboard OK")
              else:
                  print("badge scoreboard: anchor not found")
          np_ = "src/game/client/components/nameplates.cpp"
          t = open(np_, encoding="utf-8").read()
          if "RenderBadge" not in t:
              a = "TextRender()->RenderTextContainer(m_aNamePlates[ClientID].m_NameTextContainerIndex, TColor, TOutlineColor, Position.x - tw / 2.0f, YOffset);"
              if a in t:
                  b = ("if(g_Config.m_ClRivalsBadge && CRivalsMusicHud::IsRivalsClient(m_pClient, ClientID))\n\t\t\t\tm_pClient->m_RivalsMusicHud.RenderBadge(Position.x - tw / 2.0f - FontSize * 0.55f, YOffset + FontSize * 0.6f, FontSize * 0.4f, TColor.a);\n\t\t\t" + a)
                  t = t.replace(a, b, 1)
                  t = "#include <engine/shared/config.h>\n#include <game/client/gameclient.h>\n#include <game/client/components/rivals/music_hud.h>\n" + t
                  open(np_, "w", encoding="utf-8").write(t)
                  print("badge nameplates OK")
              else:
                  print("badge nameplates: anchor not found")

      - name: Configure
        run: |
          mkdir ddnet/release
          cd ddnet/release
          cmake -A x64 "-DEXCEPTION_HANDLING=ON" "-DVULKAN=OFF" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=." ..

      - name: Build client
        shell: python
        working-directory: ddnet/release
        run: |
          import subprocess, sys, re
          p = subprocess.run(["cmake", "--build", ".", "--config", "Release", "--target", "game-client", "game-server"],
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          out = p.stdout.decode("utf-8", "replace")
          print(out)
          if p.returncode != 0:
              errs = []
              for line in out.splitlines():
                  if re.search(r"error [A-Z]+\d+|: error|fatal error", line) and line not in errs:
                      errs.append(line.strip())
              print("=" * 30 + " ОШИБКИ " + "=" * 30)
              for e in errs[:40]:
                  e = re.sub(r"^.*?([A-Za-z_]+\.(?:cpp|h)\()", r"\1", e)
                  print(e)
                  print("::error::" + e[:400])
              sys.exit(p.returncode)

      - name: Package
        shell: pwsh
        run: |
          cd ddnet/release
          cmake --build . --config Release --target package_default
          $zip = Get-ChildItem *-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg
          $root = Get-ChildItem pkg -Directory | Select-Object -First 1
          # свои шрифты из rivals/data/fonts кладём в data/fonts клиента
          Copy-Item "$env:RIVALS_DIR/data/fonts/*" "$($root.FullName)/data/fonts/" -Include *.ttf,*.otf -ErrorAction SilentlyContinue
          Rename-Item $root.FullName "RIVALS-Gores-Client"
          New-Item -ItemType Directory -Force ../../out | Out-Null
          Compress-Archive -Path pkg/RIVALS-Gores-Client -DestinationPath ../../out/RIVALS-Gores-Client-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: RIVALS-Gores-Client-win64
          path: out/RIVALS-Gores-Client-win64.zip

      - name: Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/RIVALS-Gores-Client-win64.zip
