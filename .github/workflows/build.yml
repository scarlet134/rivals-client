          # визуализатор: компонент
          def gc_h(s):
              if "m_RivalsViz;" in s:
                  return s
              m = re.search(r'#include [<"][^>"]*rivals/music_hud\.h[>"]\n', s)
              inc = '#include "components/rivals/visualizer.h"\n#include "components/rivals/rain.h"\n#include "components/rivals/spec_hud.h"\n#include "components/rivals/social.h"\n#include "components/rivals/race.h"\n'
              if m:
                  s = s[:m.end()] + inc + s[m.end():]
              else:
                  a = '#include "components/chat.h"\n'
                  assert a in s, "gameclient.h include anchor"
                  s = s.replace(a, a + inc, 1)
              a = "\tCRivalsFx m_RivalsFx;\n"
              assert a in s, "gameclient.h viz anchor"
              return s.replace(a, a + "\tCRivalsVisualizer m_RivalsViz;\n\tCRivalsRain m_RivalsRain;\n\tCRivalsSpecHud m_RivalsSpecHud;\n\tCRivalsSocial m_RivalsSocial;\n\tCRivalsRace m_RivalsRace;\n", 1)
          patch("src/game/client/gameclient.h", gc_h)

          def gc_cpp(s):
              if "&m_RivalsViz" in s:
                  return s
              i = s.index("m_vpAll.insert(")
              j = s.index("&m_Hud,", i)
              s = s[:j] + "&m_RivalsViz,\n\t\t\t\t\t      &m_RivalsSpecHud,\n\t\t\t\t\t      &m_RivalsRace,\n\t\t\t\t\t      &m_RivalsSocial,\n\t\t\t\t\t      &m_Hud," + s[j + len("&m_Hud,"):]
              # колесо фраз получает ввод раньше управления
              mi = s.index("m_vpInput.insert(")
              bi = s.index("&m_Bindwheel,", mi)
              s = s[:bi] + "&m_RivalsSocial,\n\t\t\t\t\t\t  &m_Bindwheel," + s[bi + len("&m_Bindwheel,"):]
              # дождь — сразу после фона карты (за блоками и игроками)
              k = s.index("&m_MapLayersBackground,", i)
              k = s.index("\n", k) + 1
              m = re.match(r"[ \t]*&m_RivalsBackground,[^\n]*\n", s[k:])
              if m:
                  k += m.end()
              return s[:k] + "\t\t\t\t\t      &m_RivalsRain,\n" + s[k:]
