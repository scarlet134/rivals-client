                  "\t\t{\n\t\t\tconst ColorRGBA RivA = CRivalsMusicHud::Accent(1.0f);\n"
                  "\t\t\tColor = ColorRGBA(mix(RivA.r, 1.0f, 0.82f), mix(RivA.g, 1.0f, 0.82f), mix(RivA.b, 1.0f, 0.82f), 1.0f);\n\t\t}\n"
                  "\t\tCRivalsChatFilter::AppendText(TextRender(), Line.m_TextContainerIndex, &AppendCursor, pText, Color, Line.m_Highlighted && Line.m_ClientID >= 0);\n"), 1)
              # 4) запомнить ширину плашки
              a = "\t\t\tLine.m_QuadContainerIndex = Graphics()->CreateRectQuadContainer(Begin, y, FullWidth,"
              assert s.count(a) == 1, "chat width anchor"
              s = s.replace(a, "\t\t\tLine.m_RivWidth = FullWidth;\n" + a, 1)
              # 5) неоновая плашка
              a = ("\t\t\t\tGraphics()->SetColor(0, 0, 0, 0.12f * Blend);\n"
                   "\t\t\t\tGraphics()->RenderQuadContainerEx(Line.m_QuadContainerIndex, 0, -1, 0, ((y + RealMsgPaddingY / 2.0f) - Line.m_TextYOffset));\n")
              assert a in s, "chat background anchor"
              b = ("\t\t\t\tconst bool RivHl = Line.m_Highlighted && g_Config.m_ClRivalsChatHl && g_Config.m_ClRivalsChatHlStyle != CRivalsChatFilter::HL_STYLE_TEXT && Line.m_RivWidth > 0.0f;\n"
                   "\t\t\t\tif(!RivHl)\n\t\t\t\t{\n" + a.replace("\t\t\t\t", "\t\t\t\t\t") + "\t\t\t\t}\n"
                   "\t\t\t\telse\n\t\t\t\t{\n"
                   "\t\t\t\t\tconst bool RivNeon = g_Config.m_ClRivalsChatHlStyle == CRivalsChatFilter::HL_STYLE_NEON;\n"
