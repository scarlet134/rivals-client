              s = "#include <game/client/components/rivals/chat_filter.h>\n#include <game/client/components/rivals/music_hud.h>\n" + s
              # 1) фильтр в начале AddLine
              a = "m_pClient->m_aClients[ClientID].m_Foe))))\n\t\treturn;\n"
              assert a in s, "chat filter anchor"
              s = s.replace(a, a + (
                  "\n\t// RIVALS: фильтр чата\n"
                  "\t{\n"
                  "\t\tconst int RivL0 = m_pClient->m_aLocalIDs[0], RivL1 = m_pClient->m_aLocalIDs[1];\n"
                  "\t\tconst bool RivLocal = ClientID >= 0 && (ClientID == RivL0 || ClientID == m_pClient->m_Snap.m_LocalClientID || (m_pClient->Client()->DummyConnected() && ClientID == RivL1));\n"
                  "\t\tCRivalsChatFilter::SetOwnNames(RivL0 >= 0 && RivL0 < MAX_CLIENTS ? m_pClient->m_aClients[RivL0].m_aName : \"\",\n"
