          # --- RIVALS v10: фильтр и подсветка чата + аудио-визуализатор ---
          import re, base64, os

          def patch(path, fn):
              s = open(path, encoding="utf-8").read()
              n = fn(s)
              if n != s:
                  open(path, "w", encoding="utf-8", newline="\n").write(n)

          ms = open("src/game/client/components/menus_settings.cpp", encoding="utf-8", errors="ignore").read()
          for fn, data in RIV10.items():
              t = base64.b64decode(data).decode("utf-8")
              if "UI()->DoLabel" in ms and "Ui()->DoLabel" not in ms:
                  t = t.replace("Ui()->", "UI()->")
              os.makedirs(os.path.dirname(fn), exist_ok=True)
              open(fn, "w", encoding="utf-8", newline="\n").write(t)

          # настройки
          cv = "src/engine/shared/config_variables.h"
          t = open(cv, encoding="utf-8").read()
          add = ""
          for line in CFG10:
              name = re.match(r"MACRO_CONFIG_\w+\((\w+),", line).group(1)
              if "(" + name + "," not in t:
                  add += line + "\n"
          a = 'offset from top")\n'
          assert a in t, "config anchor"
          t = t.replace(a, a + add, 1)
          t = re.sub(r"(MACRO_CONFIG_INT\(ClRivalsPage, cl_rivals_page, 0, 0, )7,", r"\g<1>9,", t)
          t = re.sub(r"(MACRO_CONFIG_INT\(ClRivalsMotionBlur, cl_rivals_motion_blur, \d+, 0, )1,", r"\g<1>2,", t)
          open(cv, "w", encoding="utf-8").write(t)

          # протокол: число зрителей (SpectatorCount, новые серверы DDNet)
