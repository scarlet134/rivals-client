name: Build RIVALS Client

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  # База: DDNetGores/client (Tater-Client), релиз 18.0.2
  # Если сборка сломается после обновления DDNet — поставь тег, например 19.4
  DDNET_REF: "18.0.2"

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout RIVALS
        uses: actions/checkout@v5
        with:
          path: rivals

      - name: Checkout DDNet
        uses: actions/checkout@v5
        with:
          repository: DDNetGores/client
          ref: ${{ env.DDNET_REF }}
          path: ddnet
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find RIVALS files
        shell: pwsh
        run: |
          # ищем apply_rivals.py в любой папке репозитория
          $script = Get-ChildItem -Path rivals -Recurse -Filter apply_rivals.py | Select-Object -First 1
          if (-not $script) {
            # файлы загружены архивом .zip - распаковываем сами
            Get-ChildItem -Path rivals -Recurse -Filter *.zip | ForEach-Object {
              Write-Host "Unzip $($_.FullName)"
              Expand-Archive -Path $_.FullName -DestinationPath "rivals_unzipped/$($_.BaseName)" -Force
            }
            if (Test-Path rivals_unzipped) {
              $script = Get-ChildItem -Path rivals_unzipped -Recurse -Filter apply_rivals.py | Select-Object -First 1
            }
          }
          if (-not $script) {
            Write-Host "NOT FOUND scripts/apply_rivals.py"
            Get-ChildItem -Path rivals -Recurse | Select-Object -ExpandProperty FullName
            exit 1
          }
          $root = $script.Directory.Parent.FullName
          Write-Host "RIVALS: $root"
          "RIVALS_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply RIVALS patches
        run: python "${{ env.RIVALS_DIR }}/scripts/apply_rivals.py" ddnet

      - name: Fix CMake file list
        shell: python
        working-directory: ddnet
        run: |
          import re, subprocess
          subprocess.run(["git", "checkout", "--", "CMakeLists.txt"], check=True)
          p = "CMakeLists.txt"
          s = open(p, encoding="utf-8").read()
          new = ["components/menus_rivals.cpp", "components/rivals/media_session.cpp", "components/rivals/media_session.h", "components/rivals/music_hud.cpp", "components/rivals/music_hud.h"]
          m = re.search(r"set_src\(GAME_CLIENT GLOB_RECURSE src/game/client[ \t]*\n", s)
          end = re.compile(r"^[ \t]*\)", re.M).search(s, m.end())
          lines = [l for l in s[m.end():end.start()].split("\n") if l.strip()]
          indent = re.match(r"[ \t]*", lines[0]).group(0)
          entries = sorted(set([l.strip() for l in lines] + new))
          s = s[:m.end()] + "".join(indent + e + "\n" for e in entries) + s[end.start():]
          s = s.replace("set(PLATFORM_CLIENT_LIBS opengl32 winmm imm32)", "set(PLATFORM_CLIENT_LIBS opengl32 winmm imm32 windowsapp)", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("CMakeLists.txt OK")
          q = "src/game/client/components/menus_settings.cpp"
          t = open(q, encoding="utf-8").read()
          t = re.sub(r",\s*,(\s*\"RIVALS\")", r",\1", t)
          open(q, "w", encoding="utf-8").write(t)
          print("menus_settings.cpp OK")
          q = "src/game/client/components/rivals/media_session.cpp"
          t = open(q, encoding="utf-8").read()
          if "base/detect.h" not in t:
              t = t.replace('#include "media_session.h"', '#include "media_session.h"\n#include <base/detect.h>', 1)
          open(q, "w", encoding="utf-8").write(t)
          print("media_session.cpp OK")
          c = open("CMakeLists.txt", encoding="utf-8").read()
          if "RIVALS_CXX20" not in c:
              c += ("\n# RIVALS_CXX20\nif(MSVC)\n  set_source_files_properties(src/game/client/components/rivals/media_session.cpp "
                    "PROPERTIES COMPILE_OPTIONS \"/std:c++20;/EHsc\" "
                    "COMPILE_DEFINITIONS _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)\nendif()\n")
              open("CMakeLists.txt", "w", encoding="utf-8").write(c)
          print("C++20 for media_session OK")
          import base64
          ms = open("src/game/client/components/menus_settings.cpp", encoding="utf-8", errors="ignore").read()
          RIV = {
              "src/game/client/components/menus_rivals.cpp": "",
              "src/game/client/components/rivals/music_hud.cpp": "",
              "src/game/client/components/rivals/music_hud.h": "",
          }
          for fn, data in RIV.items():
              t = base64.b64decode(data).decode("utf-8")
              if "UI()->DoLabel" in ms and "Ui()->DoLabel" not in ms:
                  t = t.replace("Ui()->", "UI()->")
              if "Client()->ViewFile" not in ms:
                  t = t.replace("Client()->ViewFile(aBuf);", "open_file(aBuf);")
              # совместимость заголовков с разными версиями DDNet
              import os as _os
              for _inc in re.findall(r"#include <((?:base|engine|game)/[^>]+)>", t):
                  if not _os.path.exists("src/" + _inc):
                      if _inc == "base/vec2.h" and _os.path.exists("src/base/vmath.h"):
                          t = t.replace("<base/vec2.h>", "<base/vmath.h>")
                      elif _inc == "base/vmath.h" and _os.path.exists("src/base/vec2.h"):
                          t = t.replace("<base/vmath.h>", "<base/vec2.h>")
                      else:
                          print("WARNING: " + fn + ": нет заголовка " + _inc)
              open(fn, "w", encoding="utf-8", newline="\n").write(t)
          cv = "src/engine/shared/config_variables.h"
          t = open(cv, encoding="utf-8").read()
          add = ""
          if "(ClRivalsPreset," not in t: add += 'MACRO_CONFIG_INT(ClRivalsPreset, cl_rivals_preset, 0, 0, 3, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: optimizer preset")' + "\n"
          if "(ClRivalsHideParticles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHideParticles, cl_rivals_hide_particles, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: hide particles/details")' + "\n"
          if "(ClRivalsHideSkins," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHideSkins, cl_rivals_hide_skins, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: simple skins only")' + "\n"
          if "(ClRivalsHideBubbles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHideBubbles, cl_rivals_hide_bubbles, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: hide emotes/chat bubbles")' + "\n"
          if "(ClRivalsFastInput," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFastInput, cl_rivals_fast_input, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: fast input / low latency")' + "\n"
          if "(ClRivalsPage," not in t: add += 'MACRO_CONFIG_INT(ClRivalsPage, cl_rivals_page, 0, 0, 6, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: settings sub page")' + "\n"
          if "(ClRivalsAccent," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAccent, cl_rivals_accent, 0, 0, 5, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: accent color")' + "\n"
          if "(ClRivalsFps," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFps, cl_rivals_fps, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: FPS counter")' + "\n"
          if "(ClRivalsClock," not in t: add += 'MACRO_CONFIG_INT(ClRivalsClock, cl_rivals_clock, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: clock")' + "\n"
          if "(ClRivalsShowKeys," not in t: add += 'MACRO_CONFIG_INT(ClRivalsShowKeys, cl_rivals_show_keys, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: show key presses")' + "\n"
          if "(ClRivalsHookLines," not in t: add += 'MACRO_CONFIG_INT(ClRivalsHookLines, cl_rivals_hook_lines, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: hook lines of others")' + "\n"
          if "(ClRivalsFilter," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFilter, cl_rivals_filter, 0, 0, 4, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen filter")' + "\n"
          if "(ClRivalsFilterStrength," not in t: add += 'MACRO_CONFIG_INT(ClRivalsFilterStrength, cl_rivals_filter_strength, 15, 0, 60, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen filter strength")' + "\n"
          if "(ClRivalsParticles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticles, cl_rivals_particles, 0, 0, 5, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen particles (0=off, 1=snow, 2=stars, 3=sakura, 4=sparks, 5=bubbles)")' + "\n"
          if "(ClRivalsParticlesAmount," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticlesAmount, cl_rivals_particles_amount, 60, 10, 250, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: screen particles amount")' + "\n"
          if "(ClRivalsParticlesAccent," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticlesAccent, cl_rivals_particles_accent, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: tint particles with accent color")' + "\n"
          if "(ClRivalsParticlesBlur," not in t: add += 'MACRO_CONFIG_INT(ClRivalsParticlesBlur, cl_rivals_particles_blur, 0, 0, 100, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: particles blur")' + "\n"
          if "(ClRivalsChatSmooth," not in t: add += 'MACRO_CONFIG_INT(ClRivalsChatSmooth, cl_rivals_chat_smooth, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: smooth letters in chat input")' + "\n"
          if "(ClRivalsChatSmoothMs," not in t: add += 'MACRO_CONFIG_INT(ClRivalsChatSmoothMs, cl_rivals_chat_smooth_ms, 200, 50, 600, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: chat letter fade-in time (ms)")' + "\n"
          if "(ClRivalsChatRise," not in t: add += 'MACRO_CONFIG_INT(ClRivalsChatRise, cl_rivals_chat_rise, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: chat letters rise from below")' + "\n"
          if "(ClRivalsAutoreply," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAutoreply, cl_rivals_autoreply, 0, 0, 2, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: autoreply (0 off, 1 when minimized, 2 always)")' + "\n"
          if "(ClRivalsAutoreplyMsg," not in t: add += 'MACRO_CONFIG_STR(ClRivalsAutoreplyMsg, cl_rivals_autoreply_msg, 128, "AFK, will reply later", CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: autoreply message")' + "\n"
          if "(ClRivalsAutoreplyCd," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAutoreplyCd, cl_rivals_autoreply_cd, 20, 5, 120, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: autoreply cooldown (seconds)")' + "\n"
          if "(ClRivalsMirror," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMirror, cl_rivals_mirror, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: mirrored GUI")' + "\n"
          if "(ClRivalsMenuTitle," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMenuTitle, cl_rivals_menu_title, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: RIVALS CLIENT title in main menu")' + "\n"
          if "(ClRivalsMotionBlur," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlur, cl_rivals_motion_blur, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur")' + "\n"
          if "(ClRivalsMotionBlurStrength," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlurStrength, cl_rivals_motion_blur_strength, 50, 10, 100, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur strength")' + "\n"
          if "(ClRivalsMusicHudStyle," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMusicHudStyle, cl_rivals_music_hud_style, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: in-game music HUD style (0=neon, 1=classic)")' + "\n"
          if "(ClRivalsMotionBlurAll," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMotionBlurAll, cl_rivals_motion_blur_all, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: motion blur for all players")' + "\n"
          a = 'offset from top")\n'
          assert a in t, "config anchor"
          t = t.replace(a, a + add, 1)
          open(cv, "w", encoding="utf-8").write(t)
          print("RIVALS v2 (tabs + visuals) OK")
          # --- RIVALS v4: частицы на заднем фоне + плавный чат ---
          import re as _re
          gh = "src/game/client/gameclient.h"
          t = open(gh, encoding="utf-8").read()
          if "m_RivalsBackground" not in t and "CRivalsMusicHud m_RivalsMusicHud;" in t:
              t = t.replace("CRivalsMusicHud m_RivalsMusicHud;", "CRivalsMusicHud m_RivalsMusicHud;\n\tCRivalsBackground m_RivalsBackground;", 1)
              open(gh, "w", encoding="utf-8").write(t)
          gc = "src/game/client/gameclient.cpp"
          t = open(gc, encoding="utf-8").read()
          if "&m_RivalsBackground" not in t:
              t, n = _re.subn(r"(&m_MapLayersBackground,[^\n]*\n)", lambda mm: mm.group(1) + "\t\t&m_RivalsBackground,\n", t, count=1)
              print("background particles:", "OK" if n else "anchor not found")
              open(gc, "w", encoding="utf-8").write(t)
          ch = "src/game/client/components/chat.cpp"
          t = open(ch, encoding="utf-8").read()
          CHAT_OLD = "\t\tconst STextBoundingBox BoundingBox = m_Input.Render(&InputCursorRect, Cursor.m_FontSize, TEXTALIGN_TL, Changed, MessageMaxWidth, 0.0f);\n"
          CHAT_NEW = base64.b64decode("").decode("utf-8")
          if "s_RivPrevChars" not in t:
              if CHAT_OLD in t:
                  t = t.replace(CHAT_OLD, CHAT_NEW, 1)
                  if "#include <vector>" not in t:
                      t = "#include <vector>\n" + t
                  open(ch, "w", encoding="utf-8").write(t)
                  print("smooth chat OK")
              else:
                  print("smooth chat: anchor not found")
          mst = "src/game/client/components/menus_start.cpp"
          t = open(mst, encoding="utf-8").read()
          if "RenderMenuTitle" not in t:
              mm = _re.search(r"Graphics\(\)->TextureSet\(g_pData->m_aImages\[IMAGE_BANNER\]\.m_Id\);.*?Graphics\(\)->QuadsEnd\(\);", t, _re.S)
              if mm:
                  t = t[:mm.start()] + "if(g_Config.m_ClRivalsMenuTitle)\n\t\tGameClient()->m_RivalsMusicHud.RenderMenuTitle(MainView.w / 2.0f, 50.0f, 115.0f);\n\telse\n\t{\n\t" + mm.group(0) + "\n\t}" + t[mm.end():]
                  t = "#include <engine/shared/config.h>\n#include <game/client/gameclient.h>\n#include <game/client/components/rivals/music_hud.h>\n" + t
                  open(mst, "w", encoding="utf-8").write(t)
                  print("menu title OK")
              else:
                  print("menu title: anchor not found")

      - name: Apply RIVALS v5 (main menu + quick menu + R badge)
        shell: python
        working-directory: ddnet
        run: |
          # --- RIVALS v5: кастомное главное меню + быстрое меню по правому Shift ---
          import re

          def patch(path, fn):
              s = open(path, encoding="utf-8").read()
              n = fn(s)
              if n != s:
                  open(path, "w", encoding="utf-8", newline="\n").write(n)

          cv = "src/engine/shared/config_variables.h"
          t = open(cv, encoding="utf-8").read()
          add = ""
          if "(ClRivalsCustomMenu," not in t: add += 'MACRO_CONFIG_INT(ClRivalsCustomMenu, cl_rivals_custom_menu, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: custom main menu")' + "\n"
          if "(ClRivalsMenuParticles," not in t: add += 'MACRO_CONFIG_INT(ClRivalsMenuParticles, cl_rivals_menu_particles, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: particles in main menu")' + "\n"
          if "(ClRivalsQuickMenu," not in t: add += 'MACRO_CONFIG_INT(ClRivalsQuickMenu, cl_rivals_quick_menu, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: open quick menu with right shift")' + "\n"
          if add:
              a = 'offset from top")\n'
              assert a in t, "config anchor"
              t = t.replace(a, a + add, 1)
              open(cv, "w", encoding="utf-8", newline="\n").write(t)
          print("v5 config OK")

          def menus_h(s):
              if "RenderStartMenuRivals" in s:
                  return s
              a = "\tvoid RenderSettingsRivals(CUIRect MainView);\n"
              assert a in s, "menus.h anchor"
              return s.replace(a, a + "\tvoid RenderStartMenuRivals(CUIRect MainView);\n\tvoid RenderRivalsQuickMenu(CUIRect Screen);\n\tvoid ToggleRivalsQuickMenu();\n\tbool m_RivalsQuickMenu = false;\n\tbool m_RivalsQuickMenuWasActive = false;\n\tfloat m_RivalsQuickMenuOpenTime = 0.0f;\n", 1)
          patch("src/game/client/components/menus.h", menus_h)
          print("v5 menus.h OK")

          def menus_cpp(s):
              if "RenderRivalsQuickMenu" in s:
                  return s
              # 1) правый Shift
              a = "bool CMenus::OnInput(const IInput::CEvent &Event)\n{\n"
              assert a in s, "OnInput anchor"
              s = s.replace(a, a + "\t// RIVALS: быстрое меню по правому Shift (без автоповтора при удержании)\n"
                  "\tstatic bool s_RivalsRShiftHeld = false;\n"
                  "\tif(Event.m_Key == KEY_RSHIFT && (Event.m_Flags & IInput::FLAG_RELEASE))\n"
                  "\t\ts_RivalsRShiftHeld = false;\n"
                  "\tif(Event.m_Key == KEY_RSHIFT && (Event.m_Flags & IInput::FLAG_PRESS) && s_RivalsRShiftHeld)\n"
                  "\t\treturn true;\n"
                  "\tif(g_Config.m_ClRivalsQuickMenu && (Event.m_Flags & IInput::FLAG_PRESS) && Event.m_Key == KEY_RSHIFT && !g_Config.m_ClEditor &&\n"
                  "\t\tCLineInput::GetActiveInput() == nullptr && !m_pClient->m_Chat.IsActive() && m_pClient->m_GameConsole.IsClosed() &&\n"
                  "\t\t!m_Binder.m_TakeKey && m_Popup == POPUP_NONE && Client()->State() != IClient::STATE_DEMOPLAYBACK)\n"
                  "\t{\n\t\ts_RivalsRShiftHeld = true;\n\t\tToggleRivalsQuickMenu();\n\t\treturn true;\n\t}\n", 1)
              # 2) отрисовка вместо обычной страницы
              a = "\t\tif(m_ShowStart && Client()->State() == IClient::STATE_OFFLINE)\n\t\t{\n\t\t\tm_pBackground->ChangePosition(CMenuBackground::POS_START);\n"
              assert a in s, "Render anchor"
              s = s.replace(a, "\t\tif(m_RivalsQuickMenu)\n\t\t{\n\t\t\tRenderRivalsQuickMenu(Screen);\n\t\t}\n\t\telse " + a.lstrip("\t"), 1)
              # 3) сброс, если меню закрыли другим способом
              a = "\tif(!IsActive())\n\t{\n\t\tif(UI()->ConsumeHotkey(CUI::HOTKEY_ESCAPE))\n"
              assert a in s, "OnRender anchor"
              s = s.replace(a, "\tif(!IsActive())\n\t{\n\t\tm_RivalsQuickMenu = false;\n\t\tif(UI()->ConsumeHotkey(CUI::HOTKEY_ESCAPE))\n", 1)
              if "#include <engine/keys.h>" not in s:
                  s = "#include <engine/keys.h>\n" + s
              return s
          patch("src/game/client/components/menus.cpp", menus_cpp)
          print("v5 menus.cpp OK")

          def menus_start(s):
              if "RenderStartMenuRivals" in s:
                  return s
              a = "void CMenus::RenderStartMenu(CUIRect MainView)\n{\n"
              assert a in s, "RenderStartMenu anchor"
              return s.replace(a, a + "\t// RIVALS: кастомное главное меню (cl_rivals_custom_menu)\n\tif(g_Config.m_ClRivalsCustomMenu)\n\t{\n\t\tRenderStartMenuRivals(MainView);\n\t\treturn;\n\t}\n", 1)
          patch("src/game/client/components/menus_start.cpp", menus_start)
          print("v5 menus_start.cpp OK")

          # --- RIVALS v6: значок R у игроков с RIVALS (метка в старшем байте цветов скина) ---
          t = open(cv, encoding="utf-8").read()
          add = ""
          if "(ClRivalsBadge," not in t: add += 'MACRO_CONFIG_INT(ClRivalsBadge, cl_rivals_badge, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: show R badge for RIVALS players (scoreboard and nameplates)")' + "\n"
          if "(ClRivalsBadgeShare," not in t: add += 'MACRO_CONFIG_INT(ClRivalsBadgeShare, cl_rivals_badge_share, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: let other RIVALS players see that you use RIVALS")' + "\n"
          if "(ClRivalsBadgeColor," not in t: add += 'MACRO_CONFIG_INT(ClRivalsBadgeColor, cl_rivals_badge_color, 0, 0, 8, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: badge color (8 = rainbow)")' + "\n"
          if "(ClRivalsBadgeShape," not in t: add += 'MACRO_CONFIG_INT(ClRivalsBadgeShape, cl_rivals_badge_shape, 0, 0, 7, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: badge background shape (0 hexagon, 1 circle, 2 square, 3 diamond, 4 triangle, 5 star, 6 octagon, 7 pentagon)")' + "\n"
          if "(ClRivalsBadgeAnim," not in t: add += 'MACRO_CONFIG_INT(ClRivalsBadgeAnim, cl_rivals_badge_anim, 0, 0, 5, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: badge animation (0 none, 1 pulse, 2 spin, 3 heartbeat, 4 jump, 5 all)")' + "\n"
          if add:
              a = 'offset from top")\n'
              assert a in t, "config anchor"
              t = t.replace(a, a + add, 1)
              open(cv, "w", encoding="utf-8", newline="\n").write(t)
          print("v6 config OK")

          def gameclient_cpp(s):
              if "MarkBody(" in s:
                  return s
              s, n1 = re.subn(r"Msg\.m_ColorBody = (g_Config\.m_Cl\w+ColorBody);", r"Msg.m_ColorBody = CRivalsMusicHud::MarkBody(\1);", s)
              s, n2 = re.subn(r"Msg\.m_ColorFeet = (g_Config\.m_Cl\w+ColorFeet);", r"Msg.m_ColorFeet = CRivalsMusicHud::MarkFeet(\1);", s)
              assert n1 >= 4 and n2 >= 4, "SendInfo colors anchor %d %d" % (n1, n2)
              # проверка «сервер отфильтровал инфо» — сравниваем только сам цвет (младшие 24 бита)
              s, n3 = re.subn(r"(m_aClients\[m_aLocalIDs\[[01]\]\]\.m_Color(?:Body|Feet)) != \(int\)(g_Config\.m_Cl\w+Color(?:Body|Feet))",
                              r"(\1 & 0xFFFFFF) != ((int)\2 & 0xFFFFFF)", s)
              assert n3 == 4, "check info anchor %d" % n3
              return s
          patch("src/game/client/gameclient.cpp", gameclient_cpp)
          print("v6 gameclient.cpp OK")

          def nameplates_cpp(s):
              if "RenderBadge(" in s:
                  return s
              a = "\t\t\tTextRender()->RenderTextContainer(m_aNamePlates[ClientID].m_NameTextContainerIndex, TColor, TOutlineColor, Position.x - tw / 2.0f, YOffset);\n"
              assert a in s, "nameplates anchor"
              b = ("\t\t\t// RIVALS: значок R\n"
                   "\t\t\tif(g_Config.m_ClRivalsBadge && CRivalsMusicHud::IsRivalsClient(m_pClient->m_aClients[ClientID].m_ColorBody, m_pClient->m_aClients[ClientID].m_ColorFeet))\n"
                   "\t\t\t\tm_pClient->m_RivalsMusicHud.RenderBadge(Position.x + tw / 2.0f + FontSize * 0.75f, YOffset + FontSize * 0.6f, FontSize * 0.95f, m_pClient->m_aClients[ClientID].m_ColorBody, m_pClient->m_aClients[ClientID].m_ColorFeet, TColor.a, ClientID);\n")
              return s.replace(a, a + b, 1)
          patch("src/game/client/components/nameplates.cpp", nameplates_cpp)
          print("v6 nameplates.cpp OK")

          def scoreboard_cpp(s):
              if "RenderBadge(" in s:
                  return s
              a = "\t\t// clan\n\t\tif(str_comp(m_pClient->m_aClients[pInfo->m_ClientID].m_aClan,"
              assert a in s, "scoreboard anchor"
              b = ("\t\t// RIVALS: значок R\n"
                   "\t\tif(g_Config.m_ClRivalsBadge && CRivalsMusicHud::IsRivalsClient(m_pClient->m_aClients[pInfo->m_ClientID].m_ColorBody, m_pClient->m_aClients[pInfo->m_ClientID].m_ColorFeet))\n"
                   "\t\t\tm_pClient->m_RivalsMusicHud.RenderBadge(minimum(Cursor.m_X, NameOffset + NameLength) + FontSize * 0.7f, y + LineHeight / 2.0f, FontSize * 0.85f, m_pClient->m_aClients[pInfo->m_ClientID].m_ColorBody, m_pClient->m_aClients[pInfo->m_ClientID].m_ColorFeet, 1.0f, pInfo->m_ClientID);\n\n")
              return s.replace(a, b + a, 1)
          patch("src/game/client/components/scoreboard.cpp", scoreboard_cpp)
          print("v6 scoreboard.cpp OK")

          # --- RIVALS v7: соотношение сторон (пресеты) + островок с текстом над тии ---
          t = open(cv, encoding="utf-8").read()
          add = ""
          if "(ClRivalsAspect," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAspect, cl_rivals_aspect, 0, 0, 8, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: game aspect ratio preset (0 native, 1 16:9, 2 16:10, 3 4:3, 4 5:4, 5 3:2, 6 21:9, 7 1:1, 8 custom)")' + "\n"
          if "(ClRivalsAspectCustom," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAspectCustom, cl_rivals_aspect_custom, 133, 50, 400, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: custom aspect ratio x100 (133 = 4:3)")' + "\n"
          if "(ClRivalsTypingBubble," not in t: add += 'MACRO_CONFIG_INT(ClRivalsTypingBubble, cl_rivals_typing_bubble, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: show what you are typing above your tee")' + "\n"
          if add:
              a = 'offset from top")\n'
              assert a in t, "config anchor v7"
              t = t.replace(a, a + add, 1)
              open(cv, "w", encoding="utf-8", newline="\n").write(t)
          print("v7 config OK")

          def render_cpp(s):
              if "GameAspect(" in s:
                  return s
              a = "pGroup->m_OffsetX, pGroup->m_OffsetY, Graphics()->ScreenAspect(), Zoom, aPoints);"
              assert a in s, "render.cpp anchor"
              return s.replace(a, "pGroup->m_OffsetX, pGroup->m_OffsetY, CRivalsMusicHud::GameAspect(Graphics()->ScreenAspect()), Zoom, aPoints);", 1)
          patch("src/game/client/render.cpp", render_cpp)

          def gc_aspect(s):
              if "GameAspect(" in s:
                  return s
              n = s.count("Graphics()->ScreenAspect()")
              assert n >= 3, "gameclient aspect %d" % n
              return s.replace("Graphics()->ScreenAspect()", "CRivalsMusicHud::GameAspect(Graphics()->ScreenAspect())")
          patch("src/game/client/gameclient.cpp", gc_aspect)

          def controls_cpp(s):
              if "GameAspect(" in s:
                  return s
              a = "RenderTools()->CalcScreenParams(Graphics()->ScreenAspect(), 1.0f, &Width, &Height);"
              assert a in s, "controls anchor"
              return s.replace(a, "RenderTools()->CalcScreenParams(CRivalsMusicHud::GameAspect(Graphics()->ScreenAspect()), 1.0f, &Width, &Height);", 1)
          patch("src/game/client/components/controls.cpp", controls_cpp)
          print("v7 aspect OK")

          def chat_h(s):
              if "RivalsInputText(" in s:
                  return s
              a = "\tbool IsActive() const { return m_Mode != MODE_NONE; }\n"
              assert a in s, "chat.h anchor"
              return s.replace(a, a + "\tconst char *RivalsInputText() const { return m_Input.GetString(); }\n", 1)
          patch("src/game/client/components/chat.h", chat_h)

          def nameplates_bubble(s):
              if "RenderTypingBubble(" in s:
                  return s
              a = "void CNamePlates::OnRender()\n{\n"
              assert a in s, "nameplates OnRender anchor"
              return s.replace(a, a + "\t// RIVALS: островок с текстом над тии\n\tm_pClient->m_RivalsMusicHud.RenderTypingBubble();\n\n", 1)
          patch("src/game/client/components/nameplates.cpp", nameplates_bubble)
          print("v7 typing bubble OK")

          # --- RIVALS v8: War List + настоящий Fast Input + улучшенный антипинг ---
          t = open(cv, encoding="utf-8").read()
          add = ""
          if "(ClRivalsWarList," not in t: add += 'MACRO_CONFIG_INT(ClRivalsWarList, cl_rivals_warlist, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: highlight war/team players in chat, scoreboard and nameplates")' + "\n"
          if "(ClRivalsWarColor," not in t: add += 'MACRO_CONFIG_COL(ClRivalsWarColor, cl_rivals_war_color, 65440, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: war list color")' + "\n"
          if "(ClRivalsTeamColor," not in t: add += 'MACRO_CONFIG_COL(ClRivalsTeamColor, cl_rivals_team_color, 5635990, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: team list color")' + "\n"
          if "(ClRivalsAntiPingSmoothPace," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAntiPingSmoothPace, cl_rivals_antiping_smooth_pace, 100, 30, 300, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: antiping smoothing length in percent")' + "\n"
          if "(ClRivalsAutoMargin," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAutoMargin, cl_rivals_auto_margin, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: adapt prediction margin to ping jitter")' + "\n"
          if "(ClRivalsAutoMarginMax," not in t: add += 'MACRO_CONFIG_INT(ClRivalsAutoMarginMax, cl_rivals_auto_margin_max, 40, 5, 150, CFGFLAG_CLIENT | CFGFLAG_SAVE, "RIVALS: max auto prediction margin (ms)")' + "\n"
          if add:
              a = 'offset from top")\n'
              assert a in t, "config anchor v8"
              t = t.replace(a, a + add, 1)
              open(cv, "w", encoding="utf-8", newline="\n").write(t)
          print("v8 config OK")

          def gc_h_war(s):
              if "m_RivalsWarList;" in s:
                  return s
              a = "\tCRivalsBackground m_RivalsBackground;\n"
              assert a in s, "gameclient.h anchor"
              return s.replace(a, a + "\tCRivalsWarList m_RivalsWarList;\n", 1)
          patch("src/game/client/gameclient.h", gc_h_war)

          def gc_cpp_war(s):
              if "&m_RivalsWarList" in s:
                  return s
              s, n1 = re.subn(r"(\n[ \t]*&m_RivalsMusicHud,\n)", r"\1\t\t\t\t\t      &m_RivalsWarList,\n", s, count=1)
              # в стек ввода — сразу после меню (выше биндов и управления)
              i = s.index("m_vpInput.insert(")
              j = s.index("&m_Menus,", i)
              s = s[:j] + "&m_Menus,\n\t\t\t\t\t\t  &m_RivalsWarList," + s[j + len("&m_Menus,"):]
              assert n1 == 1, "vpAll anchor"
              # Fast Input: предсказываем на 1 тик вперёд со свежим вводом (≈ -20 мс визуальной задержки)
              a = "\tfor(int Tick = Client()->GameTick(g_Config.m_ClDummy) + 1; Tick <= Client()->PredGameTick(g_Config.m_ClDummy); Tick++)\n\t{\n"
              assert a in s, "predict loop anchor"
              s = s.replace(a, "\tconst bool RivFast = g_Config.m_ClRivalsFastInput && !m_IsDummySwapping && Client()->State() == IClient::STATE_ONLINE;\n"
                               "\tconst int RivPredEnd = Client()->PredGameTick(g_Config.m_ClDummy) + (RivFast ? 1 : 0);\n"
                               "\tfor(int Tick = Client()->GameTick(g_Config.m_ClDummy) + 1; Tick <= RivPredEnd; Tick++)\n\t{\n", 1)
              a1 = "\t\t// fetch the previous characters\n\t\tif(Tick == Client()->PredGameTick(g_Config.m_ClDummy))\n"
              a2 = "\t\t// fetch the current characters\n\t\tif(Tick == Client()->PredGameTick(g_Config.m_ClDummy))\n"
              assert a1 in s and a2 in s, "predict fetch anchors"
              s = s.replace(a1, a1.replace("Client()->PredGameTick(g_Config.m_ClDummy)", "RivPredEnd"), 1)
              s = s.replace(a2, a2.replace("Client()->PredGameTick(g_Config.m_ClDummy)", "RivPredEnd"), 1)
              a = "\t\tCNetObj_PlayerInput *pInputData = (CNetObj_PlayerInput *)Client()->GetInput(Tick, m_IsDummySwapping);\n"
              assert a in s, "predict input anchor"
              s = s.replace(a, a +
                  "\t\tCNetObj_PlayerInput RivFastInputData;\n"
                  "\t\tif(RivFast && Tick > Client()->PredGameTick(g_Config.m_ClDummy) && !m_Chat.IsActive() && !m_Menus.IsActive())\n"
                  "\t\t{\n"
                  "\t\t\tconst int Dm = g_Config.m_ClDummy;\n"
                  "\t\t\tRivFastInputData = m_Controls.m_aInputData[Dm];\n"
                  "\t\t\tRivFastInputData.m_Direction = 0;\n"
                  "\t\t\tif(m_Controls.m_aInputDirectionLeft[Dm] && !m_Controls.m_aInputDirectionRight[Dm])\n"
                  "\t\t\t\tRivFastInputData.m_Direction = -1;\n"
                  "\t\t\tif(!m_Controls.m_aInputDirectionLeft[Dm] && m_Controls.m_aInputDirectionRight[Dm])\n"
                  "\t\t\t\tRivFastInputData.m_Direction = 1;\n"
                  "\t\t\tRivFastInputData.m_TargetX = (int)m_Controls.m_aMousePos[Dm].x;\n"
                  "\t\t\tRivFastInputData.m_TargetY = (int)m_Controls.m_aMousePos[Dm].y;\n"
                  "\t\t\tif(!RivFastInputData.m_TargetX && !RivFastInputData.m_TargetY)\n"
                  "\t\t\t\tRivFastInputData.m_TargetX = 1;\n"
                  "\t\t\tpInputData = &RivFastInputData;\n"
                  "\t\t}\n", 1)
              # улучшенный антипинг: настраиваемая длина сглаживания
              a = "float SmoothPace = 4 - 1.5f * PredTime / 800.f;"
              assert a in s, "smooth pace anchor"
              s = s.replace(a, "float SmoothPace = (4 - 1.5f * PredTime / 800.f) * (g_Config.m_ClRivalsAntiPingSmoothPace / 100.0f);", 1)
              return s
          patch("src/game/client/gameclient.cpp", gc_cpp_war)
          print("v8 gameclient OK")

          def sb_war(s):
              if "m_RivalsWarList" in s:
                  return s
              a = "\t\t// score\n\t\tif(m_pClient->m_GameInfo.m_TimeScore && g_Config.m_ClDDRaceScoreBoard)"
              assert a in s, "scoreboard row anchor"
              s = s.replace(a, "\t\t// RIVALS: War List — подсветка строки\n\t\tm_pClient->m_RivalsWarList.OnScoreboardRow(pInfo->m_ClientID, x, y, w - 20.0f, LineHeight);\n\n" + a, 1)
              a = ("\t\t\tColorRGBA Color = color_cast<ColorRGBA>(ColorHSLA(g_Config.m_ClAuthedPlayerColor));\n"
                   "\t\t\tTextRender()->TextColor(Color);\n\t\t}\n")
              assert a in s, "scoreboard name color anchor"
              s = s.replace(a, a + "\t\t{\n\t\t\tColorRGBA WarColor;\n\t\t\tif(m_pClient->m_RivalsWarList.GetColor(pInfo->m_ClientID, WarColor))\n\t\t\t\tTextRender()->TextColor(WarColor);\n\t\t}\n", 1)
              a = "\t\telse\n\t\t\tTextRender()->TextColor(1.0f, 1.0f, 1.0f, 1.0f);\n\n\t\ttw = minimum(TextRender()->TextWidth(FontSize, m_pClient->m_aClients[pInfo->m_ClientID].m_aClan"
              assert a in s, "scoreboard clan anchor"
              s = s.replace(a, "\t\telse\n\t\t\tTextRender()->TextColor(1.0f, 1.0f, 1.0f, 1.0f);\n\t\t{\n\t\t\tColorRGBA WarColor;\n\t\t\tif(m_pClient->m_RivalsWarList.GetClanColor(pInfo->m_ClientID, WarColor))\n\t\t\t\tTextRender()->TextColor(WarColor);\n\t\t}\n\n\t\ttw = minimum(TextRender()->TextWidth(FontSize, m_pClient->m_aClients[pInfo->m_ClientID].m_aClan", 1)
              a = "\tRenderRecordingNotification((Width / 7) * 4 + 20);\n}"
              assert a in s, "scoreboard overlay anchor"
              s = s.replace(a, "\tRenderRecordingNotification((Width / 7) * 4 + 20);\n\n\t// RIVALS: War List — меню по ПКМ и курсор\n\tm_pClient->m_RivalsWarList.RenderScoreboardOverlay(Width, Height);\n}", 1)
              return s
          patch("src/game/client/components/scoreboard.cpp", sb_war)

          def np_war(s):
              if "m_RivalsWarList" in s:
                  return s
              a = "\t\tTOutlineColor.a *= Alpha;\n\t\tTColor.a *= Alpha;\n"
              assert a in s, "nameplates war anchor"
              return s.replace(a, "\t\t{\n\t\t\tColorRGBA WarColor;\n\t\t\tif(m_pClient->m_RivalsWarList.GetColor(ClientID, WarColor))\n\t\t\t\tTColor = ColorRGBA(WarColor.r, WarColor.g, WarColor.b, TColor.a);\n\t\t}\n" + a, 1)
          patch("src/game/client/components/nameplates.cpp", np_war)

          def chat_war(s):
              if "m_RivalsWarList" in s:
                  return s
              a = "\t\tTextRender()->TextColor(NameColor);\n\t\tTextRender()->CreateOrAppendTextContainer(Line.m_TextContainerIndex, &Cursor, aName);\n"
              assert a in s, "chat war anchor"
              return s.replace(a, "\t\tif(Line.m_ClientID >= 0)\n\t\t{\n\t\t\tColorRGBA WarColor;\n\t\t\tif(m_pClient->m_RivalsWarList.GetColor(Line.m_ClientID, WarColor))\n\t\t\t\tNameColor = WarColor;\n\t\t}\n" + a, 1)
          patch("src/game/client/components/chat.cpp", chat_war)
          print("v8 war list OK")
      - name: Configure
        run: |
          mkdir ddnet/release
          cd ddnet/release
          cmake -A x64 "-DEXCEPTION_HANDLING=ON" "-DVULKAN=OFF" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=." ..

      - name: Build client
        shell: python
        working-directory: ddnet/release
        run: |
          import subprocess, sys, re
          p = subprocess.run(["cmake", "--build", ".", "--config", "Release", "--target", "game-client", "game-server"],
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          out = p.stdout.decode("utf-8", "replace")
          print(out)
          if p.returncode != 0:
              errs = []
              for line in out.splitlines():
                  if re.search(r"error [A-Z]+\d+|: error|fatal error", line) and line not in errs:
                      errs.append(line.strip())
              print("=" * 30 + " ОШИБКИ " + "=" * 30)
              for e in errs[:40]:
                  e = re.sub(r"^.*?([A-Za-z_]+\.(?:cpp|h)\()", r"\1", e)
                  print(e)
                  print("::error::" + e[:400])
              sys.exit(p.returncode)

      - name: Package
        shell: pwsh
        run: |
          cd ddnet/release
          cmake --build . --config Release --target package_default
          $zip = Get-ChildItem *-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg
          $root = Get-ChildItem pkg -Directory | Select-Object -First 1
          # свои шрифты из rivals/data/fonts кладём в data/fonts клиента
          Copy-Item "$env:RIVALS_DIR/data/fonts/*" "$($root.FullName)/data/fonts/" -Include *.ttf,*.otf -ErrorAction SilentlyContinue
          Rename-Item $root.FullName "RIVALS-Gores-Client"
          New-Item -ItemType Directory -Force ../../out | Out-Null
          Compress-Archive -Path pkg/RIVALS-Gores-Client -DestinationPath ../../out/RIVALS-Gores-Client-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: RIVALS-Gores-Client-win64
          path: out/RIVALS-Gores-Client-win64.zip

      - name: Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/RIVALS-Gores-Client-win64.zip
