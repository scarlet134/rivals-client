                  "\t}\n"), 1)
              # 2) ключевые слова
              a = "\t\tpCurrentLine->m_Highlighted = Highlighted;\n"
              assert s.count(a) == 1, "chat highlight anchor"
              s = s.replace(a, a + (
                  "\t\tif(!Highlighted && ClientID >= 0 && Team != 2 && ClientID != m_pClient->m_aLocalIDs[0] && (!m_pClient->Client()->DummyConnected() || ClientID != m_pClient->m_aLocalIDs[1]) && CRivalsChatFilter::HasKeyword(pLine))\n"
                  "\t\t{\n\t\t\tHighlighted = true;\n\t\t\tpCurrentLine->m_Highlighted = true;\n\t\t}\n"), 1)
